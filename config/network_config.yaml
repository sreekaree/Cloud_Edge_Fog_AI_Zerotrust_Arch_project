simulation:
  duration_seconds: 30
  default_packet_size_bytes: 256
  random_seed: 42
  mode: auto # auto selects Mininet when installed, otherwise the fallback simulator
links:
  iomt_to_edge: {latency_ms: 2.0, bandwidth_mbps: 20.0, loss_percent: 0.0}
  edge_to_fog: {latency_ms: 8.0, bandwidth_mbps: 100.0, loss_percent: 0.0}
  fog_to_cloud: {latency_ms: 25.0, bandwidth_mbps: 200.0, loss_percent: 0.0}
  iomt_to_cloud_baseline: {latency_ms: 45.0, bandwidth_mbps: 30.0, loss_percent: 0.0}
processing_delay_ms: {edge: 1.0, fog: 2.0, cloud: 5.0}
tenants:
  hospital_a:
    edge: {id: edge_a, ip: 10.1.2.10}
    fog: {id: fog_a, ip: 10.1.3.10}
    devices:
      - {id: ecg_a, type: ECG, ip: 10.1.1.11, interval_seconds: 1.0, priority: high}
      - {id: bp_a, type: Blood Pressure, ip: 10.1.1.12, interval_seconds: 2.0, priority: medium}
      - {id: spo2_a, type: SpO2, ip: 10.1.1.13, interval_seconds: 1.5, priority: high}
  hospital_b:
    edge: {id: edge_b, ip: 10.2.2.10}
    fog: {id: fog_b, ip: 10.2.3.10}
    devices:
      - {id: ecg_b, type: ECG, ip: 10.2.1.11, interval_seconds: 1.0, priority: high}
      - {id: bp_b, type: Blood Pressure, ip: 10.2.1.12, interval_seconds: 2.0, priority: medium}
      - {id: temp_b, type: Temperature, ip: 10.2.1.13, interval_seconds: 3.0, priority: medium}
cloud: {id: cloud, ip: 10.10.0.10}
